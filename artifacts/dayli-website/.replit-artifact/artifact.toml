kind = "web"
previewPath = "/"
title = "dayli.ai"
version = "1.0.0"
id = "artifacts/dayli-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22304

[services.development]
run = "pnpm --filter @workspace/dayli-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dayli-website", "run", "build" ]
publicDir = "artifacts/dayli-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22304"
BASE_PATH = "/"
