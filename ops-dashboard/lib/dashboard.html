<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>dayli ops dashboard</title>
<style>
  :root {
    --bg: #f8f9fb;
    --surface: #ffffff;
    --surface-alt: #f1f3f5;
    --fg: #1a1d23;
    --fg-muted: #6b7280;
    --border: #e2e5ea;
    --teal: #0E5C5A;
    --teal-light: #e6f5f3;
    --orange: #F79F2F;
    --orange-light: #fef3e2;
    --red: #ef4444;
    --red-light: #fef2f2;
    --green: #059669;
    --green-light: #ecfdf5;
    --blue: #2563eb;
    --blue-light: #eff6ff;
    --font: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0f14;
      --surface: #131a23;
      --surface-alt: #1a2230;
      --fg: #e6edf3;
      --fg-muted: #8b98a9;
      --border: #1f2a37;
      --teal: #2dd4bf;
      --teal-light: #0f2d2a;
      --orange: #fbbf24;
      --orange-light: #3d2a0a;
      --red: #f87171;
      --red-light: #2d1215;
      --green: #34d399;
      --green-light: #0a2d1e;
      --blue: #60a5fa;
      --blue-light: #0f1d3a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0f14;
    --surface: #131a23;
    --surface-alt: #1a2230;
    --fg: #e6edf3;
    --fg-muted: #8b98a9;
    --border: #1f2a37;
    --teal: #2dd4bf;
    --teal-light: #0f2d2a;
    --orange: #fbbf24;
    --orange-light: #3d2a0a;
    --red: #f87171;
    --red-light: #2d1215;
    --green: #34d399;
    --green-light: #0a2d1e;
    --blue: #60a5fa;
    --blue-light: #0f1d3a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 var(--font);
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .logo {
    width: 28px; height: 28px; border-radius: 6px;
    background: var(--teal); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; flex-shrink: 0;
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  .status-bar {
    margin-left: auto; display: flex; align-items: center; gap: 12px;
    font-size: 12px; color: var(--fg-muted); font-family: var(--mono);
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    display: inline-block; margin-right: 4px;
  }
  .dot-ok { background: var(--green); }
  .dot-warn { background: var(--orange); }
  .dot-bad { background: var(--red); }

  main { padding: 16px 20px; max-width: 1280px; margin: 0 auto; }

  .grid {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 18px;
  }
  .card-full { grid-column: 1 / -1; }
  .card h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--fg-muted); margin: 0 0 12px; font-weight: 600;
  }

  .kpi-row { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 10px; }
  .kpi { min-width: 74px; }
  .kpi-val {
    display: block; font-size: 22px; font-weight: 600;
    font-family: var(--mono); line-height: 1.2;
  }
  .kpi-label {
    font-size: 10px; color: var(--fg-muted);
    text-transform: uppercase; letter-spacing: 0.5px;
  }

  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 4px 0; vertical-align: baseline; text-align: left; }
  td:last-child, th:last-child { text-align: right; font-family: var(--mono); }
  th { font-size: 11px; color: var(--fg-muted); font-weight: 500; border-bottom: 1px solid var(--border); }
  .row-sep td { border-top: 1px solid var(--border); }

  .trend-wrap { overflow-x: auto; }
  .trend-wrap table { min-width: 540px; }
  .trend-wrap th, .trend-wrap td { padding: 4px 8px; }
  .trend-wrap td { border-top: 1px solid var(--border); }

  .ok { color: var(--green); } .warn { color: var(--orange); } .bad { color: var(--red); }
  .muted { color: var(--fg-muted); }
  .mono { font-family: var(--mono); }
  .empty { color: var(--fg-muted); font-style: italic; font-size: 13px; }

  .action-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .btn {
    font: 12px/1 var(--font); font-weight: 600;
    padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface); color: var(--fg); cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn:hover { background: var(--surface-alt); border-color: var(--teal); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--teal); color: #fff; border-color: var(--teal); }
  .btn-primary:hover { opacity: 0.9; }

  .aurora-badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 700; font-family: var(--mono);
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .aurora-live { background: var(--green-light); color: var(--green); }
  .aurora-stale { background: var(--orange-light); color: var(--orange); }
  .aurora-offline { background: var(--red-light); color: var(--red); }

  .climate-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 8px; margin-top: 8px;
  }
  .climate-tile {
    background: var(--surface-alt); border-radius: 6px; padding: 10px 12px;
    text-align: center;
  }
  .climate-tile .kpi-val { font-size: 18px; }
  .climate-tile .kpi-label { font-size: 9px; }

  footer {
    padding: 16px 20px; color: var(--fg-muted); font-size: 11px;
    text-align: center; border-top: 1px solid var(--border);
    margin-top: 20px;
  }

  .conn-diagram {
    font-family: var(--mono); font-size: 11px;
    background: var(--surface-alt); border-radius: 6px;
    padding: 10px 14px; margin-top: 8px; overflow-x: auto;
    white-space: pre; line-height: 1.4; color: var(--fg-muted);
  }

  @media (max-width: 600px) {
    main { padding: 12px; }
    .grid { grid-template-columns: 1fr; }
    .kpi-row { gap: 12px; }
    header { padding: 10px 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">D</div>
  <h1>dayli ops dashboard</h1>
  <div class="status-bar">
    <span id="conn-status"><span class="status-dot dot-warn"></span>connecting…</span>
    <span id="stamp"></span>
  </div>
</header>

<main>
  <div class="grid" id="grid">
    <div class="card card-full" style="text-align:center;padding:40px">
      <span class="muted">Loading metrics from backend…</span>
    </div>
  </div>
</main>

<footer>
  Aggregate counts only — no phone numbers, no message content. Auto-refreshes every 15s.
  <br>Standalone dashboard connected to chatbot backend via internal API.
</footer>

<script>
const $ = id => document.getElementById(id);
const n = v => (v == null ? '—' : typeof v === 'number' ? v.toLocaleString() : v);
const pct = (a, b) => b ? ((a / b) * 100).toFixed(1) : '0.0';

function rows(obj, emptyLabel) {
  const entries = Object.entries(obj || {}).filter(([, v]) => v);
  if (!entries.length) return `<p class="empty">${emptyLabel}</p>`;
  entries.sort((a, b) => b[1] - a[1]);
  return '<table>' + entries.map(([k, v]) =>
    `<tr><td>${k}</td><td>${n(v)}</td></tr>`).join('') + '</table>';
}

function pick(counters, prefix) {
  const out = {};
  for (const [k, v] of Object.entries(counters || {})) {
    if (k.startsWith(prefix)) out[k.slice(prefix.length)] = v;
  }
  return out;
}

function uptime(s) {
  if (s == null) return '—';
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  return d ? d + 'd ' + h + 'h' : h ? h + 'h ' + m + 'm' : m + 'm';
}

function card(title, body, extra = '') {
  return `<div class="card ${extra}"><h2>${title}</h2>${body}</div>`;
}

let actionInProgress = false;

function render(d) {
  const c = d.process?.counters || {};
  const lat = d.process?.latency || {};
  const act = d.users || {};
  const aurora = d.aurora || {};

  const sent = c['outbound.sent'] || 0;
  const failed = c['outbound.failed'] || 0;
  const failRate = pct(failed, sent + failed);
  const aiCalls = c['ai.call'] || 0;
  const aiFail = c['ai.fail'] || 0;
  const aiFailRate = pct(aiFail, aiCalls);
  const latCls = lat.p95 == null ? '' : lat.p95 > 15000 ? 'bad' : lat.p95 > 8000 ? 'warn' : 'ok';

  const auroraClass = aurora.loaded ? (aurora.fresh ? 'aurora-live' : 'aurora-stale') : 'aurora-offline';
  const auroraLabel = aurora.loaded ? (aurora.fresh ? 'LIVE' : 'STALE') : 'OFFLINE';

  const connDot = d.service ? 'dot-ok' : 'dot-bad';
  const connLabel = d.service ? `${d.service.store} · ${d.service.safetyRules} · up ${uptime(d.process?.uptimeSeconds)}` : 'disconnected';
  $('conn-status').innerHTML = `<span class="status-dot ${connDot}"></span>${connLabel}`;
  $('stamp').textContent = new Date().toLocaleTimeString();

  const trend = (d.rollups || []).slice().reverse();
  const trendKeys = ['inbound.message', 'outbound.sent', 'outbound.failed', 'ai.fail', 'safety.risk.emergency'];

  $('grid').innerHTML = [
    // Service info
    card('Service', `
      <table>
        <tr><td>Name</td><td>${d.service?.name || '—'}</td></tr>
        <tr><td>Version</td><td>${d.service?.version || '—'}</td></tr>
        <tr><td>Store</td><td>${d.service?.store || '—'}</td></tr>
        <tr><td>Safety</td><td>${d.service?.safetyRules || '—'}</td></tr>
        <tr><td>Cloud API</td><td>${d.service?.cloudApi || '—'}</td></tr>
      </table>
      <div class="conn-diagram">Dashboard :5001 ──HTTP──► Backend :3000
x-dayli-api-key header   /ops/* endpoints</div>
    `),

    // Throughput
    card('Throughput', `
      <div class="kpi-row">
        <div class="kpi"><span class="kpi-val">${n(c['inbound.message'])}</span><span class="kpi-label">inbound</span></div>
        <div class="kpi"><span class="kpi-val">${n(sent)}</span><span class="kpi-label">sent</span></div>
        <div class="kpi"><span class="kpi-val ${failed ? 'bad' : 'ok'}">${failRate}%</span><span class="kpi-label">send fail</span></div>
        <div class="kpi"><span class="kpi-val">${n(c['inbound.dedup_suppressed'])}</span><span class="kpi-label">deduped</span></div>
      </div>
      ${rows(pick(c, 'status.'), 'No delivery receipts yet.')}
    `),

    // Reply latency
    card('Reply Latency', `
      <div class="kpi-row">
        <div class="kpi"><span class="kpi-val">${n(lat.p50)}<small style="font-size:11px"> ms</small></span><span class="kpi-label">p50</span></div>
        <div class="kpi"><span class="kpi-val ${latCls}">${n(lat.p95)}<small style="font-size:11px"> ms</small></span><span class="kpi-label">p95</span></div>
        <div class="kpi"><span class="kpi-val">${n(lat.p99)}<small style="font-size:11px"> ms</small></span><span class="kpi-label">p99</span></div>
        <div class="kpi"><span class="kpi-val">${n(lat.samples)}</span><span class="kpi-label">samples</span></div>
      </div>
      <p class="muted" style="margin:0;font-size:12px">Webhook received → reply dispatched.</p>
    `),

    // AI pipeline
    card('AI Pipeline', `
      <div class="kpi-row">
        <div class="kpi"><span class="kpi-val">${n(aiCalls)}</span><span class="kpi-label">calls</span></div>
        <div class="kpi"><span class="kpi-val ${aiFail ? 'warn' : 'ok'}">${aiFailRate}%</span><span class="kpi-label">failed</span></div>
        <div class="kpi"><span class="kpi-val">${n(c['ai.fallback_gemini'])}</span><span class="kpi-label">gemini fallback</span></div>
      </div>
      ${rows(pick(c, 'ai.'), 'No AI calls yet.')}
    `),

    // Users
    card('Users', `
      <div class="kpi-row">
        <div class="kpi"><span class="kpi-val">${n(act.consentedUsers)}</span><span class="kpi-label">consented</span></div>
        <div class="kpi"><span class="kpi-val">${n(act.activeLast24h)}</span><span class="kpi-label">active 24h</span></div>
        <div class="kpi"><span class="kpi-val">${n(act.activeLast7d)}</span><span class="kpi-label">active 7d</span></div>
        <div class="kpi"><span class="kpi-val">${n(act.windowOpen)}</span><span class="kpi-label">window open</span></div>
      </div>
      <table>
        <tr><td>Onboarded</td><td>${n(act.onboarded)}</td></tr>
        <tr><td>With location</td><td>${n(act.withLocation)}</td></tr>
        <tr><td>Follow-ups queued</td><td>${n(act.pendingFollowUps)}</td></tr>
      </table>
      <p class="muted" style="margin:8px 0 0;font-size:11px">Sessions only after consent.</p>
    `),

    // Clinical safety
    card('Clinical Safety', `
      ${rows(pick(c, 'safety.'), 'No safety events recorded.')}
      <p class="muted" style="margin:8px 0 0;font-size:11px">Violations = model overruled by safety validator.</p>
    `),

    // Consent funnel
    card('Consent Funnel', rows(pick(c, 'consent.'), 'No consent decisions this process.')),

    // Language & subject
    card('Language', rows(act.locale, 'No sessions yet.')),
    card('Subject Type', rows(act.subjectType, 'No sessions yet.')),

    // Facility lookup
    card('Facility Lookup', `
      ${rows(pick(c, 'facility.'), 'No hospital/pharmacy lookups yet.')}
      <p class="muted" style="margin:8px 0 0;font-size:11px"><code>unavailable</code> = directory did not answer.</p>
    `),

    // Aurora
    card('Aurora Climate Model', `
      <div class="kpi-row">
        <div class="kpi"><span class="aurora-badge ${auroraClass}">${auroraLabel}</span><span class="kpi-label" style="margin-top:4px;display:block">feed status</span></div>
        <div class="kpi"><span class="kpi-val">${aurora.ageHours != null ? aurora.ageHours + '<small>h</small>' : '—'}</span><span class="kpi-label">model age</span></div>
        <div class="kpi"><span class="kpi-val">${aurora.steps ?? '—'}</span><span class="kpi-label">steps</span></div>
      </div>
      <table>
        <tr><td>Coverage</td><td>Hyderabad (0.25° grid)</td></tr>
        <tr><td>Init time</td><td class="mono">${aurora.initTime ? aurora.initTime.slice(0, 16).replace('T', ' ') : '—'}</td></tr>
        <tr><td>Generated</td><td class="mono">${aurora.generatedAt ? aurora.generatedAt.slice(0, 16).replace('T', ' ') : '—'}</td></tr>
      </table>
    `),

    // Actions
    card('Actions', `
      <p class="muted" style="margin:0 0 8px;font-size:12px">Trigger operations on the chatbot backend:</p>
      <div class="action-row">
        <button class="btn btn-primary" onclick="doAction('morning-briefs')" ${actionInProgress ? 'disabled' : ''}>Send Morning Briefs</button>
        <button class="btn" onclick="doAction('feedback-survey')" ${actionInProgress ? 'disabled' : ''}>Send Feedback Survey</button>
      </div>
      <p id="action-result" class="muted" style="margin:8px 0 0;font-size:12px"></p>
    `),

    // 7-day trend
    '<div class="card card-full"><h2>Last 7 Days</h2><div class="trend-wrap">' +
      (trend.length
        ? '<table><tr><th>Date</th>' + trendKeys.map(k => `<th>${k.split('.').pop()}</th>`).join('') + '</tr>' +
          trend.map(day => '<tr><td class="mono">' + day.date + '</td>' +
            trendKeys.map(k => `<td>${n(day.counters[k] || 0)}</td>`).join('') + '</tr>').join('') +
          '</table>'
        : '<p class="empty">No rollups stored yet.</p>') +
      '</div></div>',
  ].join('');
}

async function doAction(name) {
  if (actionInProgress) return;
  actionInProgress = true;
  const el = document.getElementById('action-result');
  if (el) el.textContent = `Running ${name}…`;
  try {
    const res = await fetch(`/api/actions/${name}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' });
    const data = await res.json();
    if (el) el.textContent = `${name}: ${JSON.stringify(data).slice(0, 200)}`;
  } catch (err) {
    if (el) el.textContent = `${name} failed: ${err.message}`;
  }
  actionInProgress = false;
}

async function tick() {
  try {
    const res = await fetch('/api/metrics', { headers: { accept: 'application/json' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    render(await res.json());
  } catch (err) {
    $('conn-status').innerHTML = `<span class="status-dot dot-bad"></span>backend unreachable: ${err.message}`;
    $('stamp').textContent = new Date().toLocaleTimeString();
  }
}

tick();
setInterval(tick, 15000);
</script>
</body>
</html>
